name: Feature request
description: Propose a new capability for ANNEX
title: "[feat]: "
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: "Tell us what you want to build and why."
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, not the implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you consider?
  - type: input
    id: area
    attributes:
      label: Affected area
      description: e.g. Backend, Mobile, Web, Extension, Shared packages
    validations:
      required: true
